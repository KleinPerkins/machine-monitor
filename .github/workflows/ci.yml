name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [governance, core, service, browser-layout, browser-lifecycle, native-app]
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Install pinned verification dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Install pinned browser build
        if: startsWith(matrix.shard, 'browser-')
        run: .venv/bin/python -m playwright install chromium
      - name: Verify named shard
        env:
          SHARD: ${{ matrix.shard }}
        run: .venv/bin/python scripts/verify.py "$SHARD"
      - name: Preserve shard result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.shard }}
          path: |
            outputs/result-${{ matrix.shard }}.json
            outputs/invocation-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
  ci-required:
    if: always()
    needs: [verify]
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: result-*
          path: outputs
          merge-multiple: true
      - name: Require complete current-revision shard evidence
        env:
          JOB_RESULT: ${{ needs.verify.result }}
        run: python3 scripts/verify.py aggregate --job-result "$JOB_RESULT"
